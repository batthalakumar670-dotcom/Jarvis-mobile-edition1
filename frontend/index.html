<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J.A.R.V.I.S.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="scanlines"></div>

  <!-- TOP BAR -->
  <header class="topbar">

    <div>
      <div class="brand">J.A.R.V.I.S.</div>
      <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    </div>

    <button id="memory-btn" class="icon-btn" title="Memory">
      🧠
    </button>

  </header>


  <!-- SYSTEM CORE -->
  <main>

    <section class="core-section">

      <div class="core">

        <div class="orbit orbit1"></div>
        <div class="orbit orbit2"></div>
        <div class="orbit orbit3"></div>

        <div class="core-center">
          <div class="core-letter">J</div>
          <div class="core-status">ONLINE</div>
        </div>

      </div>

      <div id="system-state" class="system-state">
        SYSTEM READY
      </div>

    </section>


    <!-- STATUS -->
    <section class="status-grid">

      <div class="status-card">
        <span>AI CORE</span>
        <strong id="ai-status">ONLINE</strong>
      </div>

      <div class="status-card">
        <span>NETWORK</span>
        <strong id="network-status">READY</strong>
      </div>

      <div class="status-card">
        <span>MEMORY</span>
        <strong id="memory-status">ONLINE</strong>
      </div>

      <div class="status-card">
        <span>VOICE</span>
        <strong id="voice-status">READY</strong>
      </div>

    </section>


    <!-- CHAT -->
    <section class="chat-container">

      <div id="chat" class="chat"></div>

    </section>


    <!-- INPUT -->
    <section class="input-section">

      <button id="mic-btn" class="action-btn">
        🎙️
      </button>

      <input
        id="msg"
        type="text"
        autocomplete="off"
        placeholder="Ask J.A.R.V.I.S..."
      >

      <button id="send" class="send-btn">
        ➤
      </button>

    </section>


    <!-- QUICK ACTIONS -->
    <section class="quick-actions">

      <button data-query="Tell me today's Indian stock market update. Include NIFTY 50, SENSEX, major gainers, losers and important market news.">
        📈 STOCKS
      </button>

      <button data-query="What are the latest important AI news and developments today?">
        🤖 AI NEWS
      </button>

      <button data-query="What are the major world news headlines today?">
        📰 NEWS
      </button>

      <button data-query="Search the web for the latest technology news today.">
        🌐 WEB
      </button>

    </section>


    <!-- VOICE SETTINGS -->
    <section class="settings">

      <div class="settings-title">
        VOICE CONTROL
      </div>

      <label>
        Voice
        <select id="voice-select"></select>
      </label>

      <label>
        Pitch
        <input
          id="pitch"
          type="range"
          min="0.4"
          max="1.5"
          value="0.72"
          step="0.01"
        >
      </label>

      <label>
        Speed
        <input
          id="rate"
          type="range"
          min="0.6"
          max="1.4"
          value="0.92"
          step="0.01"
        >
      </label>

      <button id="test-voice" class="test-btn">
        TEST VOICE
      </button>

    </section>

  </main>


  <!-- MEMORY PANEL -->
  <aside id="memory-panel" class="memory-panel">

    <div class="memory-header">

      <div>
        <div class="memory-title">J.A.R.V.I.S. MEMORY</div>
        <div class="memory-subtitle">
          Persistent local memory
        </div>
      </div>

      <button id="close-memory" class="close-btn">
        ✕
      </button>

    </div>

    <input
      id="memory-search"
      class="memory-search"
      placeholder="Search memory..."
    >

    <div id="memory-list" class="memory-list"></div>

    <button id="save-chat" class="memory-action">
      SAVE CURRENT CHAT
    </button>

    <button id="clear-memory" class="memory-action danger">
      CLEAR MEMORY
    </button>

  </aside>

  <div id="overlay" class="overlay"></div>


  <script src="script.js"></script>

</body>
</html>
